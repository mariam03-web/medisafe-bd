<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor Registration - MediSafe BD</title>
<style>*{box-sizing:border-box}body{font-family:Arial;background:#f4f7fb;margin:0;padding:35px}.box{max-width:500px;margin:auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 15px #ddd}h1{color:#0b5ed7;text-align:center}input{width:100%;padding:11px;margin:7px 0 13px;border:1px solid #ccc;border-radius:6px}button{width:100%;padding:11px;background:#0b5ed7;color:#fff;border:0;border-radius:6px}</style></head>
<body><div class="box"><h1>Doctor Registration</h1><label>Doctor Name</label><input id="n"><label>BMDC Registration</label><input id="b"><label>Password</label><input id="p" type="password"><button onclick="reg()">Register</button><p id="m"></p><a href="doctor-login.html">Back to login</a></div>
<script>
function reg(){if(!n.value||!b.value||!p.value)return alert("Complete all fields.");localStorage.setItem("registeredDoctor",JSON.stringify({name:n.value,bmdc:b.value}));m.innerText="Registration saved. You can now login.";m.style.color="green"}
</script></body></html>
