<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor Login - MediSafe BD</title>
<style>*{box-sizing:border-box}body{font-family:Arial;background:#f4f7fb;margin:0;padding:40px}.box{max-width:390px;margin:auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 15px #ddd}h1,h2{text-align:center;color:#0b5ed7}input{width:100%;padding:11px;margin:7px 0 14px;border:1px solid #ccc;border-radius:6px}button{width:100%;padding:11px;background:#0b5ed7;color:#fff;border:0;border-radius:6px}.link{text-align:center;margin-top:15px}</style></head>
<body><div class="box"><h1>MediSafe BD</h1><h2>Doctor Portal</h2><label>Doctor Name</label><input id="name"><label>BMDC Registration</label><input id="bmdc"><label>Password</label><input id="pass" type="password"><button onclick="login()">Login</button><p class="link"><a href="doctor-register.html">Doctor Registration</a></p></div>
<script>
function login(){if(!name.value||!bmdc.value||!pass.value)return alert("Complete all fields.");localStorage.setItem("doctorName",name.value);localStorage.setItem("doctorBMDC",bmdc.value);localStorage.setItem("doctorLoggedIn","true");location.href="doctor-dashboard.html"}
</script></body></html>
