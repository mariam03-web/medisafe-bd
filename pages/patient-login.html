<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patient Login - MediSafe BD</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb}
.box{width:420px;max-width:90%;margin:80px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 4px 18px #ddd}
h1,h2{color:#0b5ed7;text-align:center}input,select{width:100%;padding:12px;margin:8px 0 15px;border:1px solid #ccd5df;border-radius:6px}
button{width:100%;padding:12px;background:#0b5ed7;color:white;border:0;border-radius:6px;cursor:pointer;font-weight:bold}
.verify{display:none}.back{background:#6c757d;margin-top:10px}
</style>
</head>
<body>

<div class="box">

<h1>MediSafe BD</h1>
<h2>Patient Portal</h2>

<div id="login">

<label>Patient Name</label>
<input id="name" placeholder="Enter your name">

<label>Patient ID</label>
<input id="id" placeholder="Enter Patient ID">

<button onclick="verify()">Continue</button>

</div>

<div id="verify" class="verify">

<h3>Verify Patient ID</h3>

<p>Select the identification method used during registration:</p>

<select id="type">
<option value="nid">NID</option>
<option value="birth">Birth Registration</option>
<option value="temporary">Temporary ID for Newborn Child</option>
</select>

<input id="verifyId" placeholder="Enter selected ID">

<button onclick="login()">Login to Patient Portal</button>

<button class="back" onclick="back()">Back</button>

</div>

</div>

<script>
function verify(){
if(!name.value.trim()||!id.value.trim())return alert("Enter Name and Patient ID.");
localStorage.setItem("patientName",name.value.trim());
localStorage.setItem("patientID",id.value.trim());
document.getElementById("login").style.display="none";
document.getElementById("verify").style.display="block";
}

function login(){
if(!verifyId.value.trim())return alert("Enter your ID.");
localStorage.setItem("patientLoggedIn","true");
localStorage.setItem("patientVerificationType",type.value);
localStorage.setItem("patientVerificationId",verifyId.value.trim());
location.href="../patient-dashboard.html";
}

function back(){
document.getElementById("verify").style.display="none";
document.getElementById("login").style.display="block";
}
</script>

</body>
</html>
