<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MediSafe BD - Patient Login</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 0;
    overflow-y:auto;
}

.box{
    width:390px;
    max-width:90%;
    background:white;
    padding:28px;
    border-radius:12px;
    box-shadow:0 4px 20px #ddd;
}

h1{
    text-align:center;
    color:#0b5ed7;
    margin-bottom:5px;
}

h2{
    text-align:center;
    color:#0b5ed7;
    margin-top:5px;
}

h3{
    color:#333;
}

label{
    display:block;
    margin-top:10px;
}

input,select{
    width:100%;
    padding:12px;
    margin:7px 0 14px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:6px;
    background:#0b5ed7;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.back{
    background:#777;
    margin-top:10px;
}

#verify{
    display:none;
}

</style>
</head>

<body>

<div class="box">

    <h1>MediSafe BD</h1>

    <h2>Patient Portal</h2>


    <!-- STEP 1 -->

    <div id="login">

        <label>Patient Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >


        <label>Patient ID</label>

        <input
            type="text"
            id="patientId"
            placeholder="Enter Patient ID"
        >


        <button onclick="nextStep()">
            Continue
        </button>

    </div>


    <!-- STEP 2 -->

    <div id="verify">

        <h3>Patient Verification</h3>


        <label>Identification Type</label>

        <select id="idType">

            <option value="nid">
                NID
            </option>

            <option value="birth">
                Birth Registration
            </option>

            <option value="temporary">
                Temporary ID for Newborn Child
            </option>

        </select>


        <label>Identification Number</label>

        <input
            type="text"
            id="verifyId"
            placeholder="Enter identification number"
        >


        <button onclick="login()">
            Login
        </button>


        <button
            class="back"
            onclick="back()"
        >
            Back
        </button>

    </div>

</div>


<script>

function nextStep(){

    const name =
        document.getElementById("name").value.trim();

    const patientId =
        document.getElementById("patientId").value.trim();


    if(!name || !patientId){

        alert(
            "Please enter your name and Patient ID."
        );

        return;
    }


    document.getElementById("login").style.display =
        "none";

    document.getElementById("verify").style.display =
        "block";
}


function back(){

    document.getElementById("verify").style.display =
        "none";

    document.getElementById("login").style.display =
        "block";
}


function login(){

    const verifyId =
        document.getElementById("verifyId").value.trim();


    if(!verifyId){

        alert(
            "Please enter your identification number."
        );

        return;
    }


    const name =
        document.getElementById("name").value.trim();

    const patientId =
        document.getElementById("patientId").value.trim();

    const idType =
        document.getElementById("idType").value;


    localStorage.setItem(
        "patientName",
        name
    );

    localStorage.setItem(
        "patientID",
        patientId
    );

    localStorage.setItem(
        "patientLoggedIn",
        "true"
    );

    localStorage.setItem(
        "patientVerificationType",
        idType
    );

    localStorage.setItem(
        "patientVerificationId",
        verifyId
    );


    window.location.href =
        "../patient-dashboard.html";
}

</script>

</body>
</html>
