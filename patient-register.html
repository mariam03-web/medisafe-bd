<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patient Registration - MediSafe BD</title>
<style>*{box-sizing:border-box}body{font-family:Arial;background:#f4f7fb;margin:0;padding:35px}.box{max-width:520px;margin:auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 15px #ddd}h1{color:#0b5ed7;text-align:center}input,select{width:100%;padding:11px;margin:7px 0 13px;border:1px solid #ccc;border-radius:6px}button{width:100%;padding:11px;background:#0b5ed7;color:#fff;border:0;border-radius:6px}</style></head>
<body><div class="box"><h1>Patient Registration</h1>
<label>Patient Name</label><input id="n"><label>Patient ID</label><input id="id" placeholder="Create Patient ID">
<label>Identification Type</label><select id="t"><option>NID</option><option>Birth Registration</option><option>Temporary ID for Newborn Child</option></select>
<label>Identification Number</label><input id="v"><button onclick="reg()">Register</button><p id="msg"></p><a href="patient-login.html">Back to login</a></div>
<script>
function reg(){if(!n.value||!id.value||!v.value)return alert("Complete all fields.");localStorage.setItem("registeredPatient",JSON.stringify({name:n.value,id:id.value,type:t.value,verification:v.value}));msg.innerText="Registration saved. You can now login with your Patient ID.";msg.style.color="green"}
</script></body></html>
