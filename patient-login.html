<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patient Login - MediSafe BD</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;min-height:100vh;display:flex;justify-content:center;padding:40px 0;overflow:auto}.box{background:#fff;width:390px;max-width:90%;padding:28px;border-radius:12px;box-shadow:0 3px 18px #ddd}h1,h2{text-align:center;color:#0b5ed7}label{display:block;margin-top:12px}input,select{width:100%;padding:11px;margin:7px 0 14px;border:1px solid #ccc;border-radius:6px}button{width:100%;padding:11px;border:0;border-radius:6px;background:#0b5ed7;color:#fff;font-weight:bold}.back{background:#777;margin-top:10px}#verify{display:none}.link{text-align:center;margin-top:15px}</style></head>
<body><div class="box"><h1>MediSafe BD</h1><h2>Patient Portal</h2>
<div id="login"><label>Patient Name</label><input id="name"><label>Patient ID</label><input id="pid" placeholder="e.g. MSBD-P-10001"><button onclick="nextStep()">Continue</button></div>
<div id="verify"><h3>Patient Verification</h3><label>Identification Type</label><select id="type"><option value="nid">NID</option><option value="birth">Birth Registration</option><option value="temporary">Temporary ID for Newborn Child</option></select><label>Identification Number</label><input id="vid"><button onclick="login()">Login</button><button class="back" onclick="back()">Back</button></div>
<div class="link"><a href="patient-register.html">New patient registration</a></div></div>
<script>
function nextStep(){if(!name.value.trim()||!pid.value.trim())return alert("Enter Patient Name and Patient ID.");loginBox();}
function loginBox(){document.getElementById("login").style.display="none";document.getElementById("verify").style.display="block"}
function back(){document.getElementById("verify").style.display="none";document.getElementById("login").style.display="block"}
function login(){if(!vid.value.trim())return alert("Enter identification number.");localStorage.setItem("patientName",name.value.trim());localStorage.setItem("patientID",pid.value.trim());localStorage.setItem("patientLoggedIn","true");localStorage.setItem("patientVerificationType",type.value);localStorage.setItem("patientVerificationId",vid.value.trim());location.href="patient-dashboard.html"}
</script></body></html>
