<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patient Login | MediSafe BD</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f8fb;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-container{
    width:92%;
    max-width:450px;
}

.logo{
    text-align:center;
    color:#0b6e69;
    font-size:28px;
    font-weight:bold;
    margin-bottom:25px;
}

.login-box{
    background:white;
    padding:35px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,0.10);
}

.login-box h1{
    text-align:center;
    color:#164e63;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#71808a;
    margin-bottom:25px;
    font-size:14px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#34495e;
    font-weight:bold;
}

select,
input{
    width:100%;
    padding:13px;
    margin-bottom:18px;
    border:1px solid #ccd6dc;
    border-radius:8px;
    font-size:15px;
}

.login-btn{
    width:100%;
    padding:13px;
    background:#0b6e69;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#095b57;
}

.register-btn{
    width:100%;
    padding:12px;
    margin-top:12px;
    background:white;
    color:#0b6e69;
    border:1px solid #0b6e69;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.back-btn{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#0b6e69;
    text-decoration:none;
    font-size:14px;
}

.demo{
    margin-top:20px;
    padding:12px;
    background:#fff8df;
    border-left:5px solid #e5ad00;
    border-radius:6px;
    color:#705900;
    font-size:13px;
    line-height:1.5;
}

</style>

</head>


<body>


<div class="login-container">


    <div class="logo">
        🛡️ MediSafe BD
    </div>


    <div class="login-box">

        <h1>
            👤 Patient Login
        </h1>

        <p class="subtitle">
            Access your personal health information
        </p>


        <label>
            Login With
        </label>

        <select id="loginType">

            <option value="patientID">
                Patient ID
            </option>

            <option value="nid">
                NID
            </option>

            <option value="birth">
                Birth Certificate
            </option>

            <option value="temporary">
                Temporary ID
            </option>

        </select>


        <label>
            Identification Number
        </label>

        <input
            type="text"
            id="patientID"
            placeholder="Enter your ID number">


        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password">


        <button
            class="login-btn"
            onclick="patientLogin()">

            Login

        </button>


        <button
            class="register-btn"
            onclick="goRegister()">

            Create Patient Account

        </button>


        <a
            href="../index.html"
            class="back-btn">

            ← Back to MediSafe BD

        </a>


        <div class="demo">

            ⚠️ <strong>Demo Mode:</strong>

            This is a course-project prototype.
            Any identification number and password can
            be used for demonstration. Real patient
            authentication will require a secure backend.

        </div>

    </div>

</div>



<script>


function patientLogin(){

    const id =
        document
        .getElementById("patientID")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value
        .trim();


    if(id === ""){

        alert(
            "Please enter your identification number."
        );

        return;

    }


    if(password === ""){

        alert(
            "Please enter your password."
        );

        return;

    }


    localStorage.setItem(
        "patientLoggedIn",
        "true"
    );


    localStorage.setItem(
        "patientID",
        id
    );


    window.location.href =
        "patient-dashboard.html";

}



function goRegister(){

    window.location.href =
        "patient-register.html";

}

</script>


</body>

</html>
